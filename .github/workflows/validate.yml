name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presets:
    name: Validate renovate presets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # `renovate` ships both the config validator and `renovate-schema.json`,
      # so one install pins the schema to the renovate version CI resolved
      # instead of fetching a URL that can drift out of sync with it.
      - name: Install renovate
        run: npm install --no-save --no-audit --no-fund renovate@latest ajv ajv-formats

      # `--no-global` matters: without it the CLI treats files passed as
      # arguments as self-hosted global config, which silently accepts options
      # that are invalid inside a preset.
      # `git ls-files` keeps this to tracked JSON, so node_modules is skipped.
      - name: renovate-config-validator
        run: ./node_modules/.bin/renovate-config-validator --strict --no-global $(git ls-files -- '*.json')

      - name: renovate-schema.json
        run: node scripts/validate-schema.mjs $(git ls-files -- '*.json')
